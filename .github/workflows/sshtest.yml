name: Detect Runner and Test SSH

on:
  workflow_dispatch:
  push:
    branches:
      - feature

jobs:
  ssh-test:
    runs-on: self-hosted

    steps:
      - name: Detect Runner Details
        run: |
          echo "Runner Name: $RUNNER_NAME"

      - name: Test SSH Connectivity
        shell: bash
        run: |
          if ssh -o StrictHostKeyChecking=no \
             -o ConnectTimeout=10 \
             ubuntu@3.95.234.232 \
             "echo SSH CONNECTION SUCCESSFUL"
          then
            echo "SSH CONNECTION TEST PASSED"
          else
            echo "SSH CONNECTION TEST FAILED"
            exit 1
          fi
