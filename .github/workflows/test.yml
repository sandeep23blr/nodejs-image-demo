name: Build Docker Image

on:
  push:
    branches:
      - main

jobs:

  docker-build:

    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ secrets.GHCR_USERNAME }}/node-app:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/node-app:${{ github.sha }}
