name: Build and Deploy Docker Application

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  docker-build:

    runs-on:
      - self-hosted
      - Linux
      - X64

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
          -t ghcr.io/${{ secrets.GHCR_USERNAME }}/node-app:${{ github.sha }} \
          -t ghcr.io/${{ secrets.GHCR_USERNAME }}/node-app:latest .

      - name: Push Docker Images
        run: |
          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/node-app:${{ github.sha }}

          docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/node-app:latest

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |

            mkdir -p /opt/node-app

            cd /opt/node-app

            docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} -p ${{ secrets.GHCR_TOKEN }}

            docker compose pull

            docker compose up -d

            docker image prune -f
