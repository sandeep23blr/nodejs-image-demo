name: Detect Runner and Test SSH

on:
  workflow_dispatch:

jobs:
  ssh-test:
    runs-on: self-hosted

    steps:
      - name: Detect Runner Details
        run: |
          echo "================================="
          echo "RUNNER DETAILS"
          echo "================================="

          echo "Runner Name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner Architecture: $RUNNER_ARCH"
          echo "Runner Workspace: $RUNNER_WORKSPACE"

          echo ""
          echo "Hostname:"
          hostname

          echo ""
          echo "Current User:"
          whoami

          echo ""
          echo "IP Address:"
          hostname -I

      - name: Test SSH Connectivity
        shell: bash
        run: |
          echo ""
          echo "================================="
          echo "TESTING SSH CONNECTION"
          echo "================================="

          if ssh -o StrictHostKeyChecking=no \
             -o ConnectTimeout=10 \
             ubuntu@3.95.234.232 \
             "echo SSH CONNECTION SUCCESSFUL && hostname && whoami"
          then
            echo ""
            echo "================================="
            echo "SSH CONNECTION TEST PASSED"
            echo "================================="
          else
            echo ""
            echo "================================="
            echo "SSH CONNECTION TEST FAILED"
            echo "================================="
            exit 1
          fi
